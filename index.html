<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <style>
        body{
            background-image:url(f2.jpg);
        }
        .nav a{
            text-decoration:none;
            font-size:18px;
            background-color:black;
            padding:10px;
            border-radius:25px;
            border: 2px solid cyan;
            margin:12px;
            color:cyan;
            font-family:Arial, Helvetica, sans-serif;
            
        }
         .nav a:hover{
            text-decoration:none;
            font-size:18px;
            background-color:cyan;
            padding:10px;
            border-radius:25px;
            border: 2px solid white;
            margin:12px;
            color:black;
            font-family:Arial, Helvetica, sans-serif;
         }
        nav{
            margin:none;
            padding:25px;
            background-color:black;
            border-radius:20px;

        }
        #btn{
            color:black;
            background-color:cyan;
            border: 2px solid black;
            box-shadow: 2px  2px 50px cyan;
                
        }
         #btn:hover{
            color:cyan;
            background-color:black;
            border: 2px solid cyan;
        }
        

    </style>
</head>
<body>
    <div class="maincontainer">
        <div class="container">
            <div class="nav">
                <nav>
                    <a href="#">Home</a>
                    <a href="About">About</a>
                    <a href="#Project">Project</a>
                    <a href="Profile">Profile</a>
                    <a href="#FAQ">FAQ</a>
                    <a href="Service" id="btn">Service</a>
                   
                </nav>
            </div>
        </div>
    </div>
</body>
</html>
